name: Release workflow

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      VCBUILD_DISABLE_RELEASE_APPROVAL: "true"
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_TOKEN }}

      - name: Install VirtoCommerce.GlobalTool
        uses: VirtoCommerce/.github/actions/setup-vcbuild@v3.1000.1

      - name: Setup Git Credentials
        uses: VirtoCommerce/.github/actions/setup-git-credentials-github@v3.1000.1
        with:
          githubToken: ${{ secrets.REPO_TOKEN }}

      - name: Run vc-build QuickRelease
        run: vc-build QuickRelease -MainBranch main
