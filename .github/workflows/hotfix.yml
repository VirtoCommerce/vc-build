name: Release hotfix

# Manual release from any branch: same pipeline as main.yml on `main`,
# but the version is taken from the `version` input instead of Directory.Build.props.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 3.1003.1 or 3.1003.1-hotfix.1 (a "-suffix" makes it a prerelease).'
        required: true
        type: string
      makeLatest:
        description: 'Mark the GitHub release as latest (ignored for prereleases).'
        required: false
        default: true
        type: boolean

jobs:
  release:
    runs-on: ubuntu-24.04
    # id-token: write lets NuGet/login mint a short-lived OIDC key (Trusted Publishing).
    # contents: write for the GitHub release step.
    permissions:
      contents: write
      id-token: write
    env:
      SONAR_TOKEN: ${{secrets.SONAR_TOKEN}}
      GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
      BLOB_SAS: ${{ secrets.BLOB_TOKEN }}

    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set version
        id: version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Invalid version '$VERSION'. Expected X.Y.Z or X.Y.Z-suffix"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi

          PREFIX="${VERSION%%-*}"
          SUFFIX=""
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then
            SUFFIX="${VERSION#*-}"
            PRERELEASE=true
          fi

          # Pin the version in Directory.Build.props (not committed) and drop the BuildNumber suffix rule.
          sed -i \
            -e "s|<VersionPrefix>.*</VersionPrefix>|<VersionPrefix>${PREFIX}</VersionPrefix>|" \
            -e "s|<VersionSuffix></VersionSuffix>|<VersionSuffix>${SUFFIX}</VersionSuffix>|" \
            -e "/<VersionSuffix Condition=/d" \
            Directory.Build.props
          grep -E '<Version(Prefix|Suffix)>' Directory.Build.props

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Install VirtoCommerce.GlobalTool
        run: |
          dotnet pack
          dotnet tool install -g VirtoCommerce.GlobalTool --add-source ./src/VirtoCommerce.Build/artifacts

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Get changelog
        id: changelog
        uses: VirtoCommerce/.github/actions/changelog-generator@v3.1000.1

      - name: SonarCloud Begin
        uses: VirtoCommerce/.github/actions/sonar-scanner-begin@v3.1000.1

      - name: Build
        run: vc-build Compile

      - name: Unit Tests
        run: vc-build Test -skip

      - name: Shelltest
        shell: bash
        working-directory: shelltests
        run: |
            sudo apt install shelltestrunner
            shelltest .

      - name: SonarCloud End
        uses: VirtoCommerce/.github/actions/sonar-scanner-end@v3.1000.1

      - name: Quality Gate
        uses: VirtoCommerce/.github/actions/sonar-quality-gate@v3.1000.1
        with:
          login: ${{secrets.SONAR_TOKEN}}

      # Trusted Publishing: swap the GitHub OIDC token for a ~1h nuget.org key, minted right before push.
      - name: NuGet login (OIDC -> temp API key)
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          # nuget.org user that created the trust policy (shared service account). Hardcoded because
          # private repos can't read org-level Actions variables in the current plan.
          user: virto

      - name: Publish Nuget
        uses: VirtoCommerce/.github/actions/publish-nuget@v3.1000.1
        env:
          NUGET_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}

      - name: Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        id: create_release
        with:
          tag_name: ${{ steps.version.outputs.version }}
          # Tag the commit that was built, not the default branch head.
          target_commitish: ${{ github.sha }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.version.outputs.prerelease != 'true' && inputs.makeLatest }}
          files: artifacts/VirtoCommerce.GlobalTool.${{ steps.version.outputs.version }}.nupkg
